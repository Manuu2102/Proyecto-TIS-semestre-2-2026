name: CD - Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Construir y publicar imágenes
    runs-on: ubuntu-latest

    env:
      BACKEND_IMAGE: ghcr.io/manuu2102/proyecto-tis-semestre-2-2026-backend
      FRONTEND_IMAGE: ghcr.io/manuu2102/proyecto-tis-semestre-2-2026-frontend
      NEXT_PUBLIC_API_URL: http://20.80.34.77:3001
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Resumen de publicación
        run: |
          echo "======================================"
          echo "IMÁGENES PUBLICADAS EN GHCR"
          echo "======================================"
          echo "Backend: $BACKEND_IMAGE:latest"
          echo "Frontend: $FRONTEND_IMAGE:latest"
          echo "Commit: $GITHUB_SHA"

  deploy:
    name: Desplegar en Azure Staging
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      - name: Desplegar aplicación en Azure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -eu

            echo "Iniciando despliegue en Azure..."

            cd /home/tisadmin/apps/Proyecto-TIS-semestre-2-2026

            echo "Descargando las nuevas imágenes..."
            docker compose pull

            echo "Actualizando los contenedores..."
            docker compose up -d --remove-orphans

            echo "Verificando disponibilidad de los servicios..."

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3001/ >/dev/null &&
                 curl -fsS http://127.0.0.1:3000/login >/dev/null; then
                echo "Frontend y backend disponibles."
                docker compose ps
                exit 0
              fi

              echo "Intento ${attempt}/30. Esperando servicios..."
              sleep 5
            done

            echo "ERROR: Los servicios no respondieron correctamente."
            docker compose ps
            docker compose logs --tail=80
            exit 1
