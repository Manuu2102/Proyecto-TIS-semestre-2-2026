name: CD - Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://20.80.34.77:3001
      CORS_ORIGIN: http://20.80.34.77:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: |
          touch backend/.env

      - name: Validar configuración Docker
        run: docker compose config

      - name: Construir imágenes de staging
        run: docker compose build

      - name: Desplegar en Azure
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /home/tisadmin/apps/Proyecto-TIS-semestre-2-2026

            echo "Actualizando código..."
            git fetch origin develop
            git reset --hard origin/develop

            echo "Construyendo y levantando staging..."
            docker compose up -d --build

            echo "Estado de los contenedores:"
            docker compose ps

      - name: Mostrar estado del despliegue
        run: |
          echo "======================================"
          echo "CD - STAGING"
          echo "======================================"
          echo "Docker Compose validado correctamente."
          echo "Imágenes construidas."
          echo "Staging actualizado en Azure."